name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  IMAGE_NAME: dealscanner
  IMAGE_REPOSITORY: ghcr.io/lachlanbwwright/dealscanner

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Typecheck frontend
        run: pnpm run typecheck
        working-directory: frontend

      - name: Lint frontend
        run: pnpm run lint
        working-directory: frontend

      - name: Build frontend
        run: pnpm run build
        working-directory: frontend

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: goserver/go.mod
          cache-dependency-path: goserver/go.sum

      - name: Install Go dependencies
        run: go mod download
        working-directory: goserver

      - name: Verify Go format
        run: |
          test -z "$(gofmt -l .)"
        working-directory: goserver

      - name: Vet Go
        run: go vet ./...
        working-directory: goserver

      - name: Install NilAway
        run: go install go.uber.org/nilaway/cmd/nilaway@latest
        working-directory: goserver

      - name: Run NilAway
        run: nilaway ./...
        working-directory: goserver

      - name: Run Go tests
        run: go test -v ./...
        working-directory: goserver

  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t dealscanner:ci .

      - name: Verify Docker image requires Turso config
        run: |
          set +e
          docker run --rm dealscanner:ci >container.log 2>&1
          status=$?
          set -e
          cat container.log
          if [ "$status" -eq 0 ]; then
            echo "Container started without required Turso configuration" >&2
            exit 1
          fi
          grep -q "TURSO_DATABASE_URL is required" container.log

  publish-image:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: docker
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_REPOSITORY }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  test-container:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: publish-image
    runs-on: ubuntu-latest
    permissions:
      packages: read

    steps:
      - name: Verify smoke test secrets
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          BOT_CLIENT_ID: ${{ secrets.BOT_CLIENT_ID }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: |
          set -euo pipefail

          echo "Container smoke test requires repository secrets:"
          echo "- TURSO_DATABASE_URL"
          echo "- TURSO_AUTH_TOKEN"
          echo "- BOT_CLIENT_ID"
          echo "- DISCORD_GUILD_ID"
          echo "- DISCORD_TOKEN"
          echo "Container smoke test sets these non-secret runtime env vars:"
          echo "- API_HOST=0.0.0.0"
          echo "- PORT=3000"
          echo "- API_SECRET=ci-smoke-test-secret"
          echo "- ENABLE_TESTING_API=false"
          echo "- SCHEDULED_SCANNER_MODE=false"
          echo "- CASH_CONVERTERS=false"
          echo "- CS_ITEMS=false"
          echo "- EBAY=false"
          echo "- GUMTREE=false"
          echo "- SALVOS=false"
          echo "- STEAM_QUERY=false"

          if [ -z "${TURSO_DATABASE_URL}" ]; then
            echo "Missing required repository secret: TURSO_DATABASE_URL" >&2
            exit 1
          fi

          if [ -z "${TURSO_AUTH_TOKEN}" ]; then
            echo "Missing required repository secret: TURSO_AUTH_TOKEN" >&2
            exit 1
          fi

          if [ -z "${BOT_CLIENT_ID}" ]; then
            echo "Missing required repository secret: BOT_CLIENT_ID" >&2
            exit 1
          fi

          if [ -z "${DISCORD_GUILD_ID}" ]; then
            echo "Missing required repository secret: DISCORD_GUILD_ID" >&2
            exit 1
          fi

          if [ -z "${DISCORD_TOKEN}" ]; then
            echo "Missing required repository secret: DISCORD_TOKEN" >&2
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull deployment image
        env:
          DEPLOY_IMAGE: ${{ env.IMAGE_REPOSITORY }}
          DEPLOY_IMAGE_TAG: sha-${{ github.sha }}
        run: docker pull "${DEPLOY_IMAGE}:${DEPLOY_IMAGE_TAG}"

      - name: Run container for 5 minutes
        env:
          DEPLOY_IMAGE: ${{ env.IMAGE_REPOSITORY }}
          DEPLOY_IMAGE_TAG: sha-${{ github.sha }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          BOT_CLIENT_ID: ${{ secrets.BOT_CLIENT_ID }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: |
          set -euo pipefail

          docker run --detach \
            --name dealscanner-smoke \
            --publish 127.0.0.1:3000:3000 \
            --env API_HOST=0.0.0.0 \
            --env PORT=3000 \
            --env API_SECRET=ci-smoke-test-secret \
            --env ENABLE_TESTING_API=false \
            --env SCHEDULED_SCANNER_MODE=false \
            --env CASH_CONVERTERS=false \
            --env CS_ITEMS=false \
            --env EBAY=false \
            --env GUMTREE=false \
            --env SALVOS=false \
            --env STEAM_QUERY=false \
            --env TURSO_DATABASE_URL="${TURSO_DATABASE_URL}" \
            --env TURSO_AUTH_TOKEN="${TURSO_AUTH_TOKEN}" \
            --env BOT_CLIENT_ID="${BOT_CLIENT_ID}" \
            --env DISCORD_GUILD_ID="${DISCORD_GUILD_ID}" \
            --env DISCORD_TOKEN="${DISCORD_TOKEN}" \
            "${DEPLOY_IMAGE}:${DEPLOY_IMAGE_TAG}"

          cleanup() {
            docker logs dealscanner-smoke || true
            docker rm --force dealscanner-smoke || true
          }
          trap cleanup EXIT

          ready=false
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null; then
              ready=true
              break
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' dealscanner-smoke)" != "true" ]; then
              echo "Container exited before becoming healthy" >&2
              exit 1
            fi
            sleep 2
          done

          if [ "${ready}" != "true" ]; then
            echo "Container stayed running but did not serve HTTP within 60 seconds" >&2
            exit 1
          fi

          curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null
          sleep 300

          if [ "$(docker inspect --format '{{.State.Running}}' dealscanner-smoke)" != "true" ]; then
            echo "Container exited during the 5 minute smoke test" >&2
            exit 1
          fi

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: test-container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Verify deploy secrets
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          API_SECRET: ${{ secrets.API_SECRET }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${ORACLE_HOST}" ]; then
            echo "Missing required repository secret: ORACLE_HOST" >&2
            exit 1
          fi

          if [ -z "${ORACLE_USER}" ]; then
            echo "Missing required repository secret: ORACLE_USER" >&2
            exit 1
          fi

          if [ -z "${ORACLE_SSH_KEY}" ]; then
            echo "Missing required repository secret: ORACLE_SSH_KEY" >&2
            exit 1
          fi

          for secret_name in API_SECRET TURSO_DATABASE_URL TURSO_AUTH_TOKEN DISCORD_TOKEN; do
            if [ -z "${!secret_name}" ]; then
              echo "Missing required repository secret: ${secret_name}" >&2
              exit 1
            fi
          done

      - name: Deploy on Oracle VM
        env:
          DEPLOY_IMAGE: ${{ env.IMAGE_REPOSITORY }}
          DEPLOY_IMAGE_TAG: sha-${{ github.sha }}
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_PORT: ${{ secrets.ORACLE_PORT }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          API_SECRET: ${{ secrets.API_SECRET }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          BOT_CLIENT_ID: ${{ vars.BOT_CLIENT_ID || secrets.BOT_CLIENT_ID }}
          DISCORD_GUILD_ID: ${{ vars.DISCORD_GUILD_ID || secrets.DISCORD_GUILD_ID }}
          SCHEDULED_SCANNER_MODE: ${{ vars.SCHEDULED_SCANNER_MODE }}
          SCHEDULED_SCANNER_DURATION_MS: ${{ vars.SCHEDULED_SCANNER_DURATION_MS }}
          CASH_CONVERTERS: ${{ vars.CASH_CONVERTERS }}
          CASH_CONVERTERS_CHANNEL_ID: ${{ vars.CASH_CONVERTERS_CHANNEL_ID }}
          CASH_CONVERTERS_ROLE_ID: ${{ vars.CASH_CONVERTERS_ROLE_ID }}
          COMMAND_PERMISSION_ROLE_ID: ${{ vars.COMMAND_PERMISSION_ROLE_ID }}
          CS_CHANNEL_ID: ${{ vars.CS_CHANNEL_ID }}
          CS_ITEMS: ${{ vars.CS_ITEMS }}
          CS_MARKET_CHANNEL_ID: ${{ vars.CS_MARKET_CHANNEL_ID }}
          CS_MARKET_ROLE_ID: ${{ vars.CS_MARKET_ROLE_ID }}
          CS_ROLE_ID: ${{ vars.CS_ROLE_ID }}
          EBAY: ${{ vars.EBAY }}
          EBAY_CHANNEL_ID: ${{ vars.EBAY_CHANNEL_ID }}
          EBAY_ROLE_ID: ${{ vars.EBAY_ROLE_ID }}
          ERROR_CHANNEL_ID: ${{ vars.ERROR_CHANNEL_ID }}
          GUMTREE: ${{ vars.GUMTREE }}
          GUMTREE_CHANNEL_ID: ${{ vars.GUMTREE_CHANNEL_ID }}
          GUMTREE_ROLE_ID: ${{ vars.GUMTREE_ROLE_ID }}
          SALVOS: ${{ vars.SALVOS }}
          SALVOS_CHANNEL_ID: ${{ vars.SALVOS_CHANNEL_ID }}
          SALVOS_ROLE_ID: ${{ vars.SALVOS_ROLE_ID }}
          STEAM_QUERY: ${{ vars.STEAM_QUERY }}
          STEAM_QUERY_CHANNEL_ID: ${{ vars.STEAM_QUERY_CHANNEL_ID }}
          STEAM_QUERY_ROLE_ID: ${{ vars.STEAM_QUERY_ROLE_ID }}
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USERNAME: ${{ github.actor }}
        run: |
          set -euo pipefail

          port="${ORACLE_PORT:-22}"
          install -m 700 -d "${HOME}/.ssh"
          printf '%s\n' "${ORACLE_SSH_KEY}" > "${HOME}/.ssh/oracle_deploy_key"
          chmod 600 "${HOME}/.ssh/oracle_deploy_key"
          ssh-keyscan -p "${port}" "${ORACLE_HOST}" >> "${HOME}/.ssh/known_hosts"

          env_dir="$(mktemp -d)"
          trap 'rm -rf "${env_dir}"' EXIT
          {
            printf 'API_HOST=0.0.0.0\n'
            printf 'API_PORT=3000\n'
            printf 'API_SECRET=%s\n' "${API_SECRET}"
            printf 'ENABLE_TESTING_API=false\n'
            printf 'TURSO_DATABASE_URL=%s\n' "${TURSO_DATABASE_URL}"
            printf 'TURSO_AUTH_TOKEN=%s\n' "${TURSO_AUTH_TOKEN}"
            printf 'SCHEDULED_SCANNER_MODE=%s\n' "${SCHEDULED_SCANNER_MODE:-false}"
            printf 'SCHEDULED_SCANNER_DURATION_MS=%s\n' "${SCHEDULED_SCANNER_DURATION_MS:-300000}"
            printf 'BOT_CLIENT_ID=%s\n' "${BOT_CLIENT_ID}"
            printf 'DISCORD_GUILD_ID=%s\n' "${DISCORD_GUILD_ID}"
            printf 'DISCORD_TOKEN=%s\n' "${DISCORD_TOKEN}"
            printf 'CASH_CONVERTERS=%s\n' "${CASH_CONVERTERS:-false}"
            printf 'CASH_CONVERTERS_CHANNEL_ID=%s\n' "${CASH_CONVERTERS_CHANNEL_ID}"
            printf 'CASH_CONVERTERS_ROLE_ID=%s\n' "${CASH_CONVERTERS_ROLE_ID}"
            printf 'COMMAND_PERMISSION_ROLE_ID=%s\n' "${COMMAND_PERMISSION_ROLE_ID}"
            printf 'CS_CHANNEL_ID=%s\n' "${CS_CHANNEL_ID}"
            printf 'CS_ITEMS=%s\n' "${CS_ITEMS:-false}"
            printf 'CS_MARKET_CHANNEL_ID=%s\n' "${CS_MARKET_CHANNEL_ID}"
            printf 'CS_MARKET_ROLE_ID=%s\n' "${CS_MARKET_ROLE_ID}"
            printf 'CS_ROLE_ID=%s\n' "${CS_ROLE_ID}"
            printf 'EBAY=%s\n' "${EBAY:-false}"
            printf 'EBAY_CHANNEL_ID=%s\n' "${EBAY_CHANNEL_ID}"
            printf 'EBAY_ROLE_ID=%s\n' "${EBAY_ROLE_ID}"
            printf 'ERROR_CHANNEL_ID=%s\n' "${ERROR_CHANNEL_ID}"
            printf 'GUMTREE=%s\n' "${GUMTREE:-false}"
            printf 'GUMTREE_CHANNEL_ID=%s\n' "${GUMTREE_CHANNEL_ID}"
            printf 'GUMTREE_ROLE_ID=%s\n' "${GUMTREE_ROLE_ID}"
            printf 'SALVOS=%s\n' "${SALVOS:-false}"
            printf 'SALVOS_CHANNEL_ID=%s\n' "${SALVOS_CHANNEL_ID}"
            printf 'SALVOS_ROLE_ID=%s\n' "${SALVOS_ROLE_ID}"
            printf 'STEAM_QUERY=%s\n' "${STEAM_QUERY:-false}"
            printf 'STEAM_QUERY_CHANNEL_ID=%s\n' "${STEAM_QUERY_CHANNEL_ID}"
            printf 'STEAM_QUERY_ROLE_ID=%s\n' "${STEAM_QUERY_ROLE_ID}"
          } > "${env_dir}/app.env"
          chmod 600 "${env_dir}/app.env"

          ssh_opts=(
            -i "${HOME}/.ssh/oracle_deploy_key"
            -p "${port}"
            -o IdentitiesOnly=yes
          )

          scp_opts=(
            -i "${HOME}/.ssh/oracle_deploy_key"
            -P "${port}"
            -o IdentitiesOnly=yes
          )

          ssh "${ssh_opts[@]}" "${ORACLE_USER}@${ORACLE_HOST}" 'sudo mkdir -p /opt/dealscanner && sudo chown "$(id -u):$(id -g)" /opt/dealscanner'
          scp "${scp_opts[@]}" deploy/oracle/deploy.sh deploy/oracle/docker-compose.prod.yml "${env_dir}/app.env" "${ORACLE_USER}@${ORACLE_HOST}:/opt/dealscanner/"
          printf '%s\n' "${GHCR_TOKEN}" | ssh "${ssh_opts[@]}" "${ORACLE_USER}@${ORACLE_HOST}" "chmod 600 /opt/dealscanner/app.env && chmod +x /opt/dealscanner/deploy.sh && GHCR_USERNAME='${GHCR_USERNAME}' DEPLOY_IMAGE='${DEPLOY_IMAGE}' DEPLOY_IMAGE_TAG='${DEPLOY_IMAGE_TAG}' /opt/dealscanner/deploy.sh"
