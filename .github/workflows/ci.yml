name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Typecheck frontend
        run: pnpm run typecheck
        working-directory: frontend

      - name: Lint frontend
        run: pnpm run lint
        working-directory: frontend

      - name: Build frontend
        run: pnpm run build
        working-directory: frontend

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: goserver/go.mod
          cache-dependency-path: goserver/go.sum

      - name: Install Go dependencies
        run: go mod download
        working-directory: goserver

      - name: Verify Go format
        run: |
          test -z "$(gofmt -l .)"
        working-directory: goserver

      - name: Vet Go
        run: go vet ./...
        working-directory: goserver

      - name: Install NilAway
        run: go install go.uber.org/nilaway/cmd/nilaway@latest
        working-directory: goserver

      - name: Run NilAway
        run: nilaway ./...
        working-directory: goserver

      - name: Run Go tests
        run: go test -v ./...
        working-directory: goserver

  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t dealscanner:ci .

      - name: Verify Docker image requires Turso config
        run: |
          set +e
          docker run --rm dealscanner:ci >container.log 2>&1
          status=$?
          set -e
          cat container.log
          if [ "$status" -eq 0 ]; then
            echo "Container started without required Turso configuration" >&2
            exit 1
          fi
          grep -q "TURSO_DATABASE_URL is required" container.log
