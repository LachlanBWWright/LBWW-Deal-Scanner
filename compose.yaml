services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-3001}:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - API_HOST=0.0.0.0
      - API_SECRET=${API_SECRET:-dealscanner-dev-secret}
      - ENABLE_TESTING_API=${ENABLE_TESTING_API:-true}
      - TURSO_DATABASE_URL=${TURSO_DATABASE_URL:?TURSO_DATABASE_URL is required}
      - TURSO_AUTH_TOKEN=${TURSO_AUTH_TOKEN:?TURSO_AUTH_TOKEN is required}
    restart: unless-stopped
