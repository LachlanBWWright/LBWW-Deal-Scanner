services:
  app:
    image: ${DEPLOY_IMAGE:?DEPLOY_IMAGE is required}:${DEPLOY_IMAGE_TAG:?DEPLOY_IMAGE_TAG is required}
    restart: unless-stopped
    env_file:
      - ./app.env
    environment:
      TURSO_DATABASE_URL: ${TURSO_DATABASE_URL:?TURSO_DATABASE_URL is required}
      TURSO_AUTH_TOKEN: ${TURSO_AUTH_TOKEN:?TURSO_AUTH_TOKEN is required}
    ports:
      - "127.0.0.1:3000:3000"
