services:
  app:
    image: ${DEPLOY_IMAGE:?DEPLOY_IMAGE is required}:${DEPLOY_IMAGE_TAG:?DEPLOY_IMAGE_TAG is required}
    restart: unless-stopped
    env_file:
      - ./app.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-file:/var/lib/dealscanner/dealscanner.db}
    volumes:
      - /opt/dealscanner/data:/var/lib/dealscanner
    ports:
      - "127.0.0.1:3000:3000"
