version: "3.3"

services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: file:/var/lib/dealscanner/dealscanner.db
    volumes:
      - ../../data:/var/lib/dealscanner
    restart: unless-stopped
